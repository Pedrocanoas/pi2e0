name: Disparar treino no Kaggle

on:
  push:
    branches: [main]
    paths:
      - "kaggle_kernel/**"
      - ".github/workflows/kaggle-train.yml"
  workflow_dispatch: {}

jobs:
  push-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install kaggle

      - name: Push e disparar o kernel no Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API }}
        run: kaggle kernels push -p kaggle_kernel/
